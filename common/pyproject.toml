[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-common"
version = "0.1.0"
description = "Shared config, enums, schemas and DB layer for the Echo security scanner services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
]

[tool.setuptools.packages.find]
include = ["echo_common*"]
