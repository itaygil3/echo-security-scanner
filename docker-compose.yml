name: echo-security-scanner

x-common-env: &common-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://echo:echo@postgres:5432/echo}
  RABBITMQ_URL: ${RABBITMQ_URL:-amqp://echo:echo@rabbitmq:5672/%2F}
  SCAN_QUEUE: ${SCAN_QUEUE:-scan_requests}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    build: ./db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-echo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-echo}
      POSTGRES_DB: ${POSTGRES_DB:-echo}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-echo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-echo}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-data:
