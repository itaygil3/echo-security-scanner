# Root Poetry project: local dev environment (shared package + dev tools) and repo-wide tool config.
# Each service has its own pyproject for its runtime dependencies.

[project]
name = "echo-security-scanner"
version = "0.1.0"
description = "Container security scanner: Trivy scans, PostgreSQL storage, REST API"
requires-python = ">=3.12,<4.0"
dependencies = ["echo-common", "echo-scanner"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
echo-common = { path = "common", develop = true }
echo-scanner = { path = "services/scanner", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-asyncio = ">=0.24"
ruff = ">=0.6"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["echo_common", "scanner"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib -m 'not e2e'"
markers = ["e2e: end-to-end tests against the running docker compose stack (run with `pytest -m e2e`)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"