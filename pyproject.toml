# Repo-wide tooling config (each service/package has its own pyproject for dependencies).

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["echo_common"]

[tool.pytest.ini_options]
addopts = "-ra"